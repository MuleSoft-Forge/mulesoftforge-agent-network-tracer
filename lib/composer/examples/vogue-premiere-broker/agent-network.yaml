agentNetwork: 2.0.0
info:
  label: Vogue Premiere Agent Network
  version: v1
registry:
  agents:
    stylingAgent:
      info:
        label: Styling Agent
      metadata:
        platform: Other
        interfaces:
          a2a_v03:
            card:
              url: ${stylingAgent.url}
              protocolVersion: 0.3.0
              name: Styling Agent
              version: 1.0.0
              description: Recommends complete outfits for the customer.
              capabilities:
                pushNotifications: false
              defaultInputModes:
                - application/json
                - text/plain
              defaultOutputModes:
                - application/json
                - text/plain
              skills:
                - id: styling-recommend-outfit
                  name: Recommend Outfit
                  description: Recommends a complete outfit for a customer's occasion.
                  tags:
                    - styling
                  inputModes:
                    - application/json
                    - text/plain
                  outputModes:
                    - application/json
                    - text/plain
    availabilityAgent:
      info:
        label: Availability Agent
      metadata:
        platform: Other
        interfaces:
          a2a_v03:
            card:
              url: ${availabilityAgent.url}
              protocolVersion: 0.3.0
              name: Availability Agent
              version: 1.0.0
              description: Verifies stock and sizes across Product 360 and the OMS.
              capabilities:
                pushNotifications: false
              defaultInputModes:
                - application/json
                - text/plain
              defaultOutputModes:
                - application/json
                - text/plain
              skills:
                - id: availability-check-stock
                  name: Check Availability
                  description: Verifies stock and size availability for products.
                  tags:
                    - availability
                  inputModes:
                    - application/json
                    - text/plain
                  outputModes:
                    - application/json
                    - text/plain
    loyaltyAgent:
      info:
        label: Loyalty Agent
      metadata:
        platform: Other
        interfaces:
          a2a_v03:
            card:
              url: ${loyaltyAgent.url}
              protocolVersion: 0.3.0
              name: Loyalty Agent
              version: 1.0.0
              description: Applies tier-specific loyalty perks.
              capabilities:
                pushNotifications: false
              defaultInputModes:
                - application/json
                - text/plain
              defaultOutputModes:
                - application/json
                - text/plain
              skills:
                - id: loyalty-apply-perks
                  name: Apply Loyalty Perks
                  description: Applies tier-specific perks to the customer.
                  tags:
                    - loyalty
                  inputModes:
                    - application/json
                    - text/plain
                  outputModes:
                    - application/json
                    - text/plain
  mcps:
    customerMcp:
      info:
        label: Customer MCP Server
      metadata:
        transport:
          kind: streamableHttp
          path: /mcp
    orderMcp:
      info:
        label: Order MCP Server
      metadata:
        transport:
          kind: streamableHttp
          path: /mcp
  llms:
    openai:
      info:
        label: OpenAI
      metadata:
        platform: OpenAI
context:
  connections:
    styling_agent_connection:
      kind: a2a
      ref:
        name: stylingAgent
      url: ${stylingAgent.url}
    availability_agent_connection:
      kind: a2a
      ref:
        name: availabilityAgent
      url: ${availabilityAgent.url}
    loyalty_agent_connection:
      kind: a2a
      ref:
        name: loyaltyAgent
      url: ${loyaltyAgent.url}
    customer_mcp_connection:
      kind: mcp
      ref:
        name: customerMcp
      url: ${customerMcp.url}
    order_mcp_connection:
      kind: mcp
      ref:
        name: orderMcp
      url: ${orderMcp.url}
    openai_connection:
      kind: llm
      ref:
        name: openai
      url: ${openai.url}
      authentication:
        kind: apiKey
        apiKey: ${openai.apiKey}
brokers:
  vogue_premiere:
    kind: AgentScript
    implementation: ./brokers/vogue_premiere.agent
    interfaces:
      a2a:
        card:
          name: Vogue Premiere Styling Concierge
          version: 1.0.0
          description: A personal luxury fashion assistant that handles styling, availability, loyalty, and orders.
          capabilities:
            streaming: true
            pushNotifications: false
          defaultInputModes:
            - application/json
            - text/plain
          defaultOutputModes:
            - application/json
            - text/plain
          skills:
            - id: vogue-style-concierge
              name: Vogue Style Concierge
              description: Handles customer-facing styling, availability, loyalty, and order interactions for Vogue Premiere.
              tags:
                - styling
                - loyalty
                - orders
                - vogue
              examples:
                - Hi, this is Alex Chen. I have a dinner in Napa next Saturday and I'm looking for an outfit that's nicer than business casual, but not a full suit
                - Can you check if all those products are available in my size?
                - Show me my loyalty perks
                - Place the order for the whole outfit.
              inputModes:
                - application/json
                - text/plain
              outputModes:
                - application/json
                - text/plain
          supportedInterfaces:
            - url: https://myOmniGateway/vogue_premiere/
              protocolVersion: "1.0"
              protocolBinding: HTTP+JSON
