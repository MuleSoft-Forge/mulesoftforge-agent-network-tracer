# =============================================================================
# Agent Network Specification 2.0.0 — complete reference document
#
# Every property defined by the bundled ANF schema bundle is populated here:
#   agent_network_v2.json  (root, registry, context, brokers, auth, policies)
#   a2a_v1.json            (Agent Card v1.x — used by `a2a` interfaces)
#   a2a.json               (AgentCard v0.3.x — used by `a2a_v03` interfaces)
#   other_card.json        (generic card — used by `other` interfaces)
#   mcp_metadata.json      (MCPServer metadata)
#   agent_metadata.json    (agent platform)
#   references.json        (AgentRef / MCPRef / LLMRef / PolicyRef)
#
# Only exception: the AgentScript body referenced by brokers[].implementation
# is intentionally not authored here.
# =============================================================================

agentNetwork: 2.0.0

# --- NetworkInfoObject --------------------------------------------------------
info:
  label: Complete Reference Agent Network
  summary: Reference network exercising every field in the Agent Network 2.0.0 schema.
  description: |
    A documentation-grade agent network that populates **every** property in the
    Agent Network Specification 2.0.0 bundle. CommonMark is allowed here.

    - three registry agents, one per interface flavour (`a2a`, `a2a_v03`, `other`)
    - three registry MCP servers, one per transport (`streamableHttp`, `sse`, `stdio`)
    - three registry LLM providers, one per supported platform
    - every connection kind and every authentication kind
    - reusable policy bindings plus inline policy bindings on every attachment point
  version: 1.0.0
  termsOfService: https://example.com/agent-network/terms
  tags:
    - reference
    - complete
    - schema-coverage
  contact:
    name: Agent Platform Team
    url: https://example.com/agent-network/support
    email: agent-platform@example.com
  license:
    name: Apache License 2.0
    # `identifier` (SPDX) and `url` are mutually exclusive per the schema.
    # Swap the two lines below to use the URL form instead.
    identifier: Apache-2.0
    # url: https://www.apache.org/licenses/LICENSE-2.0.html

# =============================================================================
# registry — publishable, reusable definitions (agents, MCP servers, LLMs)
# =============================================================================
registry:
  # ---------------------------------------------------------------------------
  # agents
  # ---------------------------------------------------------------------------
  agents:
    # -- AgentEntity #1: A2A v1.x interface (a2a_v1.json "Agent Card") ---------
    a2a_v1_agent:
      info:
        label: A2A v1 Reference Agent
        description: Demonstrates every field of the A2A protocol v1.x agent card.
        tags:
          - a2a
          - v1
          - reference
      urls:
        - name: production
          url: https://api.example.com/agents/a2a-v1
        - name: staging
          url: https://staging.example.com/agents/a2a-v1
        - name: development
          url: http://localhost:8080/agents/a2a-v1
      metadata:
        platform: MuleSoft
        # metadata.llm — the LLM provider this agent runs on
        llm:
          ref:
            name: openai_provider
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
        # metadata.tools — both ToolsRef variants
        tools:
          - mcp:
              ref:
                name: streamable_http_mcp
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
              allowed:
                - search_knowledge_base
                - create_incident
          - a2a:
              ref:
                name: a2a_v03_agent
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
        interfaces:
          a2a:
            card:
              name: A2A v1 Reference Agent
              description: Reference agent exposing the complete A2A v1.x agent card surface.
              version: 1.4.2
              documentationUrl: https://example.com/docs/agents/a2a-v1
              iconUrl: https://example.com/icons/a2a-v1-agent.png
              provider:
                organization: Example Corp
                url: https://example.com
              capabilities:
                streaming: true
                pushNotifications: true
                extendedAgentCard: true
                extensions:
                  - uri: https://developers.google.com/identity/protocols/oauth2
                    description: Google OAuth 2.0 authentication extension.
                    required: false
                    params:
                      audience: https://api.example.com
                      prompt: consent
                  - uri: https://example.com/extensions/trace-context
                    description: Propagates W3C trace context across the network.
                    required: true
                    params:
                      header: traceparent
              defaultInputModes:
                - text/plain
                - application/json
                - image/png
              defaultOutputModes:
                - text/plain
                - application/json
              supportedInterfaces:
                - protocolBinding: JSONRPC
                  protocolVersion: "1.0"
                  url: https://api.example.com/a2a/v1
                  tenant: acme-prod
                - protocolBinding: GRPC
                  protocolVersion: "1.0"
                  url: https://grpc.example.com/a2a
                  tenant: acme-prod
                - protocolBinding: HTTP+JSON
                  protocolVersion: "0.3"
                  url: https://rest.example.com/a2a/v1
                  tenant: acme-prod
              securitySchemes:
                # a2a_v1 wraps each scheme in a discriminating property name.
                api_key_scheme:
                  apiKeySecurityScheme:
                    description: Static API key issued by the Example developer portal.
                    location: header
                    name: X-API-Key
                bearer_scheme:
                  httpAuthSecurityScheme:
                    description: HTTP bearer token authentication.
                    scheme: Bearer
                    bearerFormat: JWT
                mtls_scheme:
                  mtlsSecurityScheme:
                    description: Mutual TLS using a client certificate issued by Example CA.
                oidc_scheme:
                  openIdConnectSecurityScheme:
                    description: OpenID Connect discovery based authentication.
                    openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
                oauth2_scheme:
                  oauth2SecurityScheme:
                    description: OAuth 2.0 with every flow declared.
                    oauth2MetadataUrl: https://idp.example.com/.well-known/oauth-authorization-server
                    flows:
                      authorizationCode:
                        authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                        tokenUrl: https://idp.example.com/oauth2/v1/token
                        refreshUrl: https://idp.example.com/oauth2/v1/token
                        pkceRequired: true
                        scopes:
                          agent:read: Read agent state and task history.
                          agent:write: Send messages and create tasks.
                      clientCredentials:
                        tokenUrl: https://idp.example.com/oauth2/v1/token
                        refreshUrl: https://idp.example.com/oauth2/v1/token
                        scopes:
                          agent:invoke: Machine-to-machine agent invocation.
                      deviceCode:
                        deviceAuthorizationUrl: https://idp.example.com/oauth2/v1/device/authorize
                        tokenUrl: https://idp.example.com/oauth2/v1/token
                        refreshUrl: https://idp.example.com/oauth2/v1/token
                        scopes:
                          agent:read: Read agent state from an input-constrained device.
                      implicit:
                        # Deprecated in the spec: prefer authorizationCode + PKCE.
                        authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                        refreshUrl: https://idp.example.com/oauth2/v1/token
                        scopes:
                          agent:read: Read agent state.
                      password:
                        # Deprecated in the spec: prefer authorizationCode + PKCE or deviceCode.
                        tokenUrl: https://idp.example.com/oauth2/v1/token
                        refreshUrl: https://idp.example.com/oauth2/v1/token
                        scopes:
                          agent:read: Read agent state.
              securityRequirements:
                # Explicit `schemes` map form (String List values).
                - schemes:
                    oauth2_scheme:
                      list:
                        - agent:read
                        - agent:write
                # Shorthand form via additionalProperties (scheme -> scopes array).
                - api_key_scheme: []
                  mtls_scheme: []
              signatures:
                - protected: eyJhbGciOiJFUzI1NiIsImtpZCI6ImV4YW1wbGUta2V5LTEifQ
                  signature: MEUCIQDexampleSignatureValueBase64UrlEncodedAAAAAAAAAA
                  header:
                    kid: example-key-1
                    jku: https://example.com/.well-known/jwks.json
              skills:
                - id: knowledge-search
                  name: Knowledge Base Search
                  description: Searches the corporate knowledge base and returns ranked articles.
                  tags:
                    - knowledge-base
                    - search
                  examples:
                    - How do I reset my VPN password?
                    - Find the runbook for database failover.
                  inputModes:
                    - text/plain
                    - application/json
                  outputModes:
                    - application/json
                  securityRequirements:
                    - schemes:
                        oauth2_scheme:
                          list:
                            - agent:read
                - id: incident-create
                  name: Incident Creation
                  description: Opens an incident in the ticketing system on behalf of the caller.
                  tags:
                    - incident
                    - write
                  examples:
                    - Open a P1 incident for the checkout outage.
                  inputModes:
                    - application/json
                  outputModes:
                    - application/json
                  securityRequirements:
                    - schemes:
                        oauth2_scheme:
                          list:
                            - agent:write
              # a2a_v1.json also accepts protobuf snake_case aliases for the
              # camelCase keys above. They are alternates, not extra settings:
              #   default_input_modes, default_output_modes, documentation_url,
              #   icon_url, security_requirements, security_schemes,
              #   supported_interfaces, security
              # and on skills: input_modes, output_modes, security_requirements.

    # -- AgentEntity #2: A2A v0.3.x interface (a2a.json "AgentCard") -----------
    a2a_v03_agent:
      info:
        label: A2A v0.3 Reference Agent
        description: Demonstrates every field of the A2A protocol v0.3.x agent card.
        tags:
          - a2a
          - v0.3
          - reference
      urls:
        - name: production
          url: https://api.example.com/agents/a2a-v03
        - name: staging
          url: https://staging.example.com/agents/a2a-v03
      metadata:
        platform: Other
        llm:
          ref:
            name: gemini_provider
        tools:
          - mcp:
              ref:
                name: sse_mcp
              allowed:
                - list_tickets
          - a2a:
              ref:
                name: other_protocol_agent
        interfaces:
          a2a_v03:
            card:
              name: A2A v0.3 Reference Agent
              description: Reference agent exposing the complete A2A v0.3.x agent card surface.
              protocolVersion: 0.3.0
              version: 2.1.0
              url: https://api.example.com/a2a/v03
              preferredTransport: JSONRPC
              documentationUrl: https://example.com/docs/agents/a2a-v03
              iconUrl: https://example.com/icons/a2a-v03-agent.png
              supportsAuthenticatedExtendedCard: true
              provider:
                organization: Example Corp
                url: https://example.com
              additionalInterfaces:
                - transport: JSONRPC
                  url: https://api.example.com/a2a/v03
                - transport: GRPC
                  url: https://grpc.example.com/a2a/v03
                - transport: HTTP+JSON
                  url: https://rest.example.com/a2a/v03
              capabilities:
                streaming: true
                pushNotifications: true
                stateTransitionHistory: true
                extensions:
                  - uri: https://example.com/extensions/audit-log
                    description: Emits an immutable audit record for every task transition.
                    required: false
                    params:
                      sink: https://audit.example.com/ingest
                      retentionDays: 365
              defaultInputModes:
                - text/plain
                - application/json
              defaultOutputModes:
                - text/plain
                - application/json
              securitySchemes:
                # a2a.json v0.3 schemes are discriminated by an inline `type`.
                api_key_scheme:
                  type: apiKey
                  description: Static API key issued by the Example developer portal.
                  in: header
                  name: X-API-Key
                bearer_scheme:
                  type: http
                  description: HTTP bearer token authentication.
                  scheme: Bearer
                  bearerFormat: JWT
                mtls_scheme:
                  type: mutualTLS
                  description: Mutual TLS using a client certificate issued by Example CA.
                oidc_scheme:
                  type: openIdConnect
                  description: OpenID Connect discovery based authentication.
                  openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
                oauth2_scheme:
                  type: oauth2
                  description: OAuth 2.0 with every v0.3 flow declared.
                  oauth2MetadataUrl: https://idp.example.com/.well-known/oauth-authorization-server
                  flows:
                    authorizationCode:
                      authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                      tokenUrl: https://idp.example.com/oauth2/v1/token
                      refreshUrl: https://idp.example.com/oauth2/v1/token
                      scopes:
                        agent:read: Read agent state and task history.
                        agent:write: Send messages and create tasks.
                    clientCredentials:
                      tokenUrl: https://idp.example.com/oauth2/v1/token
                      refreshUrl: https://idp.example.com/oauth2/v1/token
                      scopes:
                        agent:invoke: Machine-to-machine agent invocation.
                    implicit:
                      authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                      refreshUrl: https://idp.example.com/oauth2/v1/token
                      scopes:
                        agent:read: Read agent state.
                    password:
                      tokenUrl: https://idp.example.com/oauth2/v1/token
                      refreshUrl: https://idp.example.com/oauth2/v1/token
                      scopes:
                        agent:read: Read agent state.
              security:
                # OR of ANDs: OAuth2 alone, or API key AND mTLS together.
                - oauth2_scheme:
                    - agent:read
                    - agent:write
                - api_key_scheme: []
                  mtls_scheme: []
              signatures:
                - protected: eyJhbGciOiJFUzI1NiIsImtpZCI6ImV4YW1wbGUta2V5LTIifQ
                  signature: MEQCIH0exampleSignatureValueBase64UrlEncodedBBBBBBBB
                  header:
                    kid: example-key-2
                    jku: https://example.com/.well-known/jwks.json
              skills:
                - id: ticket-triage
                  name: Ticket Triage
                  description: Classifies inbound support tickets and assigns a priority.
                  tags:
                    - it-support
                    - triage
                  examples:
                    - Triage this ticket about a failed deployment.
                  inputModes:
                    - text/plain
                  outputModes:
                    - application/json
                  security:
                    - oauth2_scheme:
                        - agent:read

    # -- AgentEntity #3: non-A2A interface (other_card.json "OtherCard") -------
    other_protocol_agent:
      info:
        label: Custom Protocol Reference Agent
        description: Demonstrates the generic `other` interface and its card.
        tags:
          - custom-protocol
          - reference
      urls:
        - name: production
          url: https://api.example.com/agents/custom
      metadata:
        platform: Salesforce
        llm:
          ref:
            name: azure_openai_provider
        tools:
          - mcp:
              ref:
                name: stdio_mcp
              allowed:
                - read_file
                - write_file
        interfaces:
          other:
            protocol: acme-agent-protocol/1.2
            card:
              name: Custom Protocol Reference Agent
              description: Reference agent speaking a non-A2A, vendor-specific protocol.
              version: 3.0.0
              url: https://api.example.com/custom/v1
              documentationUrl: https://example.com/docs/agents/custom
              iconUrl: https://example.com/icons/custom-agent.png
              provider:
                organization: Example Corp
                url: https://example.com
              defaultInputModes:
                - text/plain
                - application/json
              defaultOutputModes:
                - application/json
              securitySchemes:
                api_key_scheme:
                  type: apiKey
                  description: Static API key.
                  in: query
                  name: api_key
                bearer_scheme:
                  type: http
                  description: HTTP bearer token authentication.
                  scheme: Bearer
                  bearerFormat: JWT
                oidc_scheme:
                  type: openIdConnect
                  description: OpenID Connect discovery based authentication.
                  openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
              security:
                - api_key_scheme: []
                - oidc_scheme:
                    - openid
                    - profile
              skills:
                - id: batch-translate
                  name: Batch Translation
                  description: Translates a batch of documents between supported locales.
                  tags:
                    - translation
                    - batch
                  examples:
                    - Translate these 40 release notes into de-DE.
                  inputModes:
                    - application/json
                  outputModes:
                    - application/json

  # ---------------------------------------------------------------------------
  # mcps — one entity per MCP transport
  # ---------------------------------------------------------------------------
  mcps:
    # -- MCPServerEntity #1: streamableHttp transport, fully populated ---------
    streamable_http_mcp:
      info:
        label: Streamable HTTP MCP Server
        description: MCP server exercising every property of mcp_metadata.json MCPServer.
        tags:
          - mcp
          - streamable-http
          - reference
      urls:
        - name: production
          url: https://mcp.example.com
        - name: staging
          url: https://mcp-staging.example.com
      metadata:
        platform: MuleSoft
        protocolVersion: 2025-11-25
        transport:
          kind: streamableHttp
          path: /mcp
        provider:
          organization: Example Corp
          url: https://example.com
        capabilities:
          logging:
            level: info
          completions: {}
          experimental:
            exampleBatching:
              maxBatchSize: 25
          prompts:
            listChanged: true
          resources:
            listChanged: true
            subscribe: true
          tools:
            listChanged: true
          tasks:
            cancel: {}
            list: {}
            requests:
              tools:
                call: {}
        logging:
          supportedLevels:
            - debug
            - info
            - warning
            - error
        tools:
          - name: search_knowledge_base
            title: Search Knowledge Base
            description: Full-text search across the corporate knowledge base.
            _meta:
              owner: knowledge-platform
              costTier: low
            annotations:
              title: Search Knowledge Base
              readOnlyHint: true
              destructiveHint: false
              idempotentHint: true
              openWorldHint: true
            execution:
              taskSupport: optional
            icons:
              - src: https://example.com/icons/search-48.png
                mimeType: image/png
                sizes:
                  - 48x48
                  - 96x96
                theme: light
              - src: https://example.com/icons/search-dark.svg
                mimeType: image/svg+xml
                sizes:
                  - any
                theme: dark
            inputSchema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                query:
                  type: string
                  description: The natural language search query.
                limit:
                  type: integer
                  description: Maximum number of results to return.
                  default: 10
              required:
                - query
            outputSchema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                results:
                  type: array
                  description: Ranked knowledge base articles.
              required:
                - results
          - name: create_incident
            title: Create Incident
            description: Creates an incident record in the ticketing system.
            _meta:
              owner: itsm-platform
            annotations:
              title: Create Incident
              readOnlyHint: false
              destructiveHint: false
              idempotentHint: false
              openWorldHint: true
            execution:
              taskSupport: required
            icons:
              - src: https://example.com/icons/incident.png
                mimeType: image/png
                sizes:
                  - 64x64
                theme: light
            inputSchema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                summary:
                  type: string
                priority:
                  type: string
                  enum:
                    - P1
                    - P2
                    - P3
              required:
                - summary
                - priority
            outputSchema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                incidentId:
                  type: string
              required:
                - incidentId
        resources:
          - name: runbook-database-failover
            title: Runbook — Database Failover
            uri: https://mcp.example.com/resources/runbooks/db-failover.md
            description: Step-by-step runbook for failing over the primary database.
            mimeType: text/markdown
            size: 18342
            _meta:
              reviewedBy: sre-team
            annotations:
              audience:
                - user
                - assistant
              priority: 0.9
              lastModified: "2026-01-12T15:00:58Z"
            icons:
              - src: https://example.com/icons/runbook.png
                mimeType: image/png
                sizes:
                  - 32x32
                theme: light
        resourceTemplates:
          - name: incident-by-id
            title: Incident by ID
            uriTemplate: https://mcp.example.com/resources/incidents/{incidentId}
            description: Retrieves a single incident record by its identifier.
            mimeType: application/json
            _meta:
              generator: itsm-connector
            annotations:
              audience:
                - assistant
              priority: 0.6
              lastModified: "2026-02-01T09:12:00Z"
            icons:
              - src: https://example.com/icons/incident-template.svg
                mimeType: image/svg+xml
                sizes:
                  - any
                theme: dark
        prompts:
          - name: summarize_incident
            title: Summarize Incident
            description: Produces an executive summary of an incident and its timeline.
            _meta:
              version: 3
            icons:
              - src: https://example.com/icons/summary.png
                mimeType: image/png
                sizes:
                  - 48x48
                theme: light
            arguments:
              - name: incidentId
                title: Incident ID
                description: Identifier of the incident to summarize.
                required: true
              - name: audience
                title: Target Audience
                description: Who the summary is written for (exec, engineer, customer).
                required: false
        securitySchemes:
          api_key_scheme:
            type: apiKey
            description: Static API key for the MCP endpoint.
            in: header
            name: X-API-Key
          bearer_scheme:
            type: http
            description: HTTP bearer token authentication.
            scheme: Bearer
            bearerFormat: JWT
          mtls_scheme:
            type: mutualTLS
            description: Mutual TLS using a client certificate issued by Example CA.
          oidc_scheme:
            type: openIdConnect
            description: OpenID Connect discovery based authentication.
            openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
          oauth2_scheme:
            type: oauth2
            description: OAuth 2.0 protected MCP endpoint.
            oauth2MetadataUrl: https://idp.example.com/.well-known/oauth-authorization-server
            flows:
              clientCredentials:
                tokenUrl: https://idp.example.com/oauth2/v1/token
                refreshUrl: https://idp.example.com/oauth2/v1/token
                scopes:
                  mcp:invoke: Invoke MCP tools.

    # -- MCPServerEntity #2: sse transport -------------------------------------
    sse_mcp:
      info:
        label: SSE MCP Server
        description: MCP server using the Server-Sent Events transport.
        tags:
          - mcp
          - sse
      urls:
        - name: production
          url: https://sse-mcp.example.com
      metadata:
        platform: Other
        protocolVersion: 2025-06-18
        transport:
          kind: sse
          ssePath: /sse
          messagesPath: /messages
        provider:
          organization: Example Corp
          url: https://example.com
        capabilities:
          # Deprecated boolean shorthand for the capability objects above.
          logging: true
          prompts: false
          resources: true
          tools: true
        tools:
          - name: list_tickets
            title: List Tickets
            description: Lists open tickets assigned to a queue.
            annotations:
              title: List Tickets
              readOnlyHint: true
              openWorldHint: false
            execution:
              taskSupport: forbidden
            inputSchema:
              type: object
              properties:
                queue:
                  type: string
              required:
                - queue
        resources:
          - name: ticket-queues
            uri: https://sse-mcp.example.com/resources/queues.json
            description: The catalog of available ticket queues.
            mimeType: application/json
        prompts:
          - name: draft_ticket_reply
            description: Drafts a customer-facing reply for a ticket.
            arguments:
              - name: ticketId
                required: true
        securitySchemes:
          bearer_scheme:
            type: http
            scheme: Bearer
            bearerFormat: JWT

    # -- MCPServerEntity #3: stdio transport -----------------------------------
    stdio_mcp:
      info:
        label: Stdio MCP Server
        description: Locally launched MCP server communicating over standard I/O.
        tags:
          - mcp
          - stdio
          - local
      urls:
        - name: development
          url: file:///usr/local/bin/example-mcp
      metadata:
        platform: Other
        protocolVersion: 2024-11-05
        transport:
          kind: stdio
          instructions: npx -y @example/filesystem-mcp --root /workspace
        provider:
          organization: Example Corp
          url: https://example.com
        capabilities:
          tools:
            listChanged: false
        tools:
          - name: read_file
            description: Reads a UTF-8 file from the workspace.
            inputSchema:
              type: object
              properties:
                path:
                  type: string
              required:
                - path
          - name: write_file
            description: Writes a UTF-8 file into the workspace.
            annotations:
              readOnlyHint: false
              destructiveHint: true
              idempotentHint: false
              openWorldHint: false
            inputSchema:
              type: object
              properties:
                path:
                  type: string
                contents:
                  type: string
              required:
                - path
                - contents

    # -- MCPServerEntity #4: minimal entity (only the required property) -------
    minimal_mcp:
      metadata:
        transport:
          kind: streamableHttp

  # ---------------------------------------------------------------------------
  # llms — one entity per supported platform
  # ---------------------------------------------------------------------------
  llms:
    openai_provider:
      info:
        label: OpenAI
        description: OpenAI hosted models used across the network.
        tags:
          - llm
          - openai
      urls:
        - name: production
