# =============================================================================
# context — document-scoped reusable entities (connections, policies)
# =============================================================================
context:
  # ---------------------------------------------------------------------------
  # policies — reusable PolicyBinding definitions referenced by name elsewhere
  # ---------------------------------------------------------------------------
  policies:
    client-id-enforcement:
      ref:
        name: client-id-enforcement
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      access: shared
      configuration:
        clientId: ${clientIdEnforcement.clientId}
        clientSecret: ${clientIdEnforcement.clientSecret}
        credentialsOrigin: customExpression
    rate-limiting:
      ref:
        name: rate-limiting
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      access: internal
      configuration:
        rateLimits:
          - maximumRequests: 100
            timePeriodInMilliseconds: 60000
        clusterizable: true
        exposeHeaders: true
    prompt-guard:
      ref:
        name: prompt-guard
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      access: shared
      configuration:
        blockOnDetection: true
        categories:
          - prompt-injection
          - jailbreak
        threshold: 0.8
    pii-redaction:
      ref:
        name: pii-redaction
      access: internal
      configuration:
        entities:
          - EMAIL_ADDRESS
          - CREDIT_CARD
          - US_SSN
        action: mask
        maskCharacter: "*"

  # ---------------------------------------------------------------------------
  # connections — every ConnectionElement kind and every Authentication kind
  # ---------------------------------------------------------------------------
  connections:
    # -- LLMConnection (LLMAuthentication only allows kind: apiKey) ------------
    openai_connection:
      kind: llm
      access: shared
      ref:
        name: openai_provider
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      url: https://api.openai.com/v1
      authentication:
        kind: apiKey
        apiKey: ${openai.apiKey}
      policies:
        inbound:
          - ref:
              name: rate-limiting
              namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
        outbound:
          - policy:
              ref:
                name: llm-token-budget
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
              access: internal
              configuration:
                maxTokensPerMinute: 120000
                onExceeded: reject

    gemini_connection:
      kind: llm
      access: internal
      ref:
        name: gemini_provider
      url: https://generativelanguage.googleapis.com/v1beta
      authentication:
        kind: apiKey
        apiKey: ${gemini.apiKey}

    azure_openai_connection:
      kind: llm
      access: internal
      ref:
        name: azure_openai_provider
      url: https://example.openai.azure.com/openai/v1
      authentication:
        kind: apiKey
        apiKey: ${azureOpenai.apiKey}

    # -- MCPServerConnection with kind: basic ---------------------------------
    mcp_basic_auth_connection:
      kind: mcp
      access: internal
      ref:
        name: streamable_http_mcp
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      url: https://mcp.example.com
      authentication:
        kind: basic
        username: ${mcpBasic.username}
        password: ${mcpBasic.password}
        headerName: Authorization
      policies:
        inbound:
          - ref:
              name: client-id-enforcement
              namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
        outbound:
          - ref:
              name: pii-redaction

    # -- MCPServerConnection with kind: apiKey --------------------------------
    mcp_api_key_connection:
      kind: mcp
      access: shared
      ref:
        name: sse_mcp
      url: https://sse-mcp.example.com
      authentication:
        kind: apiKey
        apiKey: ${mcpApiKey.apiKey}
        headerName: X-API-Key

    # -- MCPServerConnection with kind: apikey-client-credentials -------------
    mcp_apikey_client_credentials_connection:
      kind: mcp
      access: internal
      ref:
        name: stdio_mcp
      url: https://stdio-bridge.example.com
      authentication:
        kind: apikey-client-credentials
        clientId:
          name: client_id
          value: ${mcpApiKeyClientCreds.clientId}
        clientSecret:
          name: client_secret
          value: ${mcpApiKeyClientCreds.clientSecret}

    # -- MCPServerConnection with kind: oauth2-client-credentials -------------
    mcp_oauth2_client_credentials_connection:
      kind: mcp
      access: internal
      ref:
        name: minimal_mcp
      url: https://minimal-mcp.example.com
      authentication:
        kind: oauth2-client-credentials
        clientId: ${mcpOauth2.clientId}
        clientSecret: ${mcpOauth2.clientSecret}
        scopes:
          - mcp:invoke
          - mcp:read
        token:
          url: https://idp.example.com/oauth2/v1/token
          timeout: 30
          bodyEncoding: form

    # -- AgentConnection with kind: oauth2-obo (RFC 8693 token exchange) ------
    agent_oauth2_obo_connection:
      kind: a2a
      access: shared
      ref:
        name: a2a_v1_agent
        namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
      url: https://api.example.com/a2a/v1
      authentication:
        kind: oauth2-obo
        flow: oauth2-token-exchange
        clientId: ${agentObo.clientId}
        clientSecret: ${agentObo.clientSecret}
        tokenEndpoint: https://idp.example.com/oauth2/v1/token
        targetType: audience
        targetValue: https://api.example.com/a2a/v1
        scope: agent:invoke
        timeout: 10000
        distributed: true
        cibaEnabled: true
        cibaEndpoint: https://idp.example.com/oauth2/v1/bc-authorize
        cibaLoginHintClaim: email
        cibaBindingMessage: Approve the agent request from the Complete Reference Network.
      policies:
        inbound:
          - ref:
              name: prompt-guard
              namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
        outbound:
          - policy:
              ref:
                name: circuit-breaker
              access: internal
              configuration:
                failureThreshold: 5
                resetTimeoutMs: 30000

    # -- AgentConnection with kind: oauth2-obo (Microsoft Entra ID OBO) -------
    agent_entra_obo_connection:
      kind: a2a
      access: internal
      ref:
        name: a2a_v03_agent
      url: https://api.example.com/a2a/v03
      authentication:
        kind: oauth2-obo
        flow: microsoft-entra-obo
        clientId: ${agentEntraObo.clientId}
        clientSecret: ${agentEntraObo.clientSecret}
        tokenEndpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
        targetType: resource
        targetValue: api://downstream-client-id
        scope: api://downstream-client-id/.default
        timeout: 15000
        distributed: false

    # -- AgentConnection with kind: in-task-authorization-code ----------------
    agent_in_task_auth_code_connection:
      kind: a2a
      access: internal
      ref:
        name: other_protocol_agent
      url: https://api.example.com/custom/v1
      authentication:
        kind: in-task-authorization-code
        secondaryAuthProvider: okta
        authorizationEndpoint: https://idp.example.com/oauth2/v1/authorize
        tokenEndpoint: https://idp.example.com/oauth2/v1/token
        scopes: openid profile email transaction:execute
        redirectUri: https://app.example.com/oauth2/callback
        responseType: code
        codeChallengeMethod: S256
        tokenAudience: https://api.example.com/custom/v1
        bodyEncoding: form
        tokenTimeout: 300
        challengeResponseStatusCode: 200
        distributed: true
        subjectTokenType: urn:ietf:params:oauth:token-type:access_token
        requestedTokenType: urn:ietf:params:oauth:token-type:access_token

# =============================================================================
# brokers — AgentScript-backed orchestrators exposed over A2A v1
#
# NOTE: `implementation` points at an AgentScript file that is intentionally
# NOT authored in this reference. Create ./brokers/complete-reference.agent
# before building or publishing this project.
# =============================================================================
brokers:
  complete_reference_broker:
    info:
      label: Complete Reference Broker
      description: Broker exercising every BrokerEntity property, including both inbound and outbound policy binding forms.
      tags:
        - broker
        - reference
        - orchestrator
    kind: AgentScript
    implementation: ./brokers/complete-reference.agent
    interfaces:
      a2a:
        policies:
          inbound:
            # Reference form — points at context.policies["client-id-enforcement"].
            - ref:
                name: client-id-enforcement
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
            - ref:
                name: rate-limiting
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
            # Inline form — a full PolicyBinding declared at the attachment point.
            - policy:
                ref:
                  name: jwt-validation
                  namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
                access: shared
                configuration:
                  jwksUrl: https://idp.example.com/.well-known/jwks.json
                  jwtOrigin: httpBearerAuthenticationHeader
                  skipClientIdValidation: false
                  clientIdExpression: "#[vars.claimSet.client_id]"
                  validateAudClaim: true
                  supportedAudiences: https://api.example.com/a2a/v1
          outbound:
            - ref:
                name: prompt-guard
                namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
            - policy:
                ref:
                  name: response-content-filter
                access: internal
                configuration:
                  blockOnDetection: false
                  categories:
                    - toxicity
                    - self-harm
                  threshold: 0.7
        card:
          name: Complete Reference Broker
          description: Orchestrates the reference agents and MCP servers on behalf of a caller.
          version: 1.0.0
          documentationUrl: https://example.com/docs/brokers/complete-reference
          iconUrl: https://example.com/icons/broker.png
          provider:
            organization: Example Corp
            url: https://example.com
          capabilities:
            streaming: true
            pushNotifications: true
            extendedAgentCard: true
            extensions:
              - uri: https://example.com/extensions/trace-context
                description: Propagates W3C trace context to every downstream agent.
                required: true
                params:
                  header: traceparent
          defaultInputModes:
            - text/plain
            - application/json
          defaultOutputModes:
            - text/plain
            - application/json
          supportedInterfaces:
            - protocolBinding: JSONRPC
              protocolVersion: "1.0"
              url: https://broker.example.com/a2a/v1
              tenant: acme-prod
            - protocolBinding: HTTP+JSON
              protocolVersion: "1.0"
              url: https://broker.example.com/a2a/rest
              tenant: acme-prod
          securitySchemes:
            broker_oauth2:
              oauth2SecurityScheme:
                description: OAuth 2.0 authorization for broker callers.
                oauth2MetadataUrl: https://idp.example.com/.well-known/oauth-authorization-server
                flows:
                  authorizationCode:
                    authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                    tokenUrl: https://idp.example.com/oauth2/v1/token
                    refreshUrl: https://idp.example.com/oauth2/v1/token
                    pkceRequired: true
                    scopes:
                      broker:invoke: Invoke the broker.
                  clientCredentials:
                    tokenUrl: https://idp.example.com/oauth2/v1/token
                    scopes:
                      broker:invoke: Machine-to-machine broker invocation.
                  deviceCode:
                    deviceAuthorizationUrl: https://idp.example.com/oauth2/v1/device/authorize
                    tokenUrl: https://idp.example.com/oauth2/v1/token
                    scopes:
                      broker:invoke: Invoke the broker from a constrained device.
                  implicit:
                    authorizationUrl: https://idp.example.com/oauth2/v1/authorize
                    scopes:
                      broker:invoke: Invoke the broker.
                  password:
                    tokenUrl: https://idp.example.com/oauth2/v1/token
                    scopes:
                      broker:invoke: Invoke the broker.
            broker_api_key:
              apiKeySecurityScheme:
                description: API key for service-to-service broker calls.
                location: header
                name: X-Broker-Key
            broker_bearer:
              httpAuthSecurityScheme:
                description: HTTP bearer token authentication.
                scheme: Bearer
                bearerFormat: JWT
            broker_mtls:
              mtlsSecurityScheme:
                description: Mutual TLS for internal callers.
            broker_oidc:
              openIdConnectSecurityScheme:
                description: OpenID Connect discovery based authentication.
                openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
          securityRequirements:
            - schemes:
                broker_oauth2:
                  list:
                    - broker:invoke
            - broker_api_key: []
              broker_mtls: []
          signatures:
            - protected: eyJhbGciOiJFUzI1NiIsImtpZCI6ImJyb2tlci1rZXktMSJ9
              signature: MEYCIQCexampleBrokerSignatureBase64UrlEncodedCCCCCCC
              header:
                kid: broker-key-1
                jku: https://example.com/.well-known/jwks.json
          skills:
            - id: investigate
              name: Cross-System Investigation
              description: Investigates an issue by fanning out to the registry agents and MCP tools.
              tags:
                - orchestration
                - investigation
              examples:
                - Why did the checkout service start erroring at 14:02?
                - Find the owner of the failing deployment and open a P1.
              inputModes:
                - text/plain
                - application/json
              outputModes:
                - application/json
              securityRequirements:
                - schemes:
                    broker_oauth2:
                      list:
                        - broker:invoke
            - id: resolve
              name: Guided Resolution
              description: Walks a caller through remediation steps and applies approved fixes.
              tags:
                - remediation
                - guided
              examples:
                - Walk me through restoring the database from last night's snapshot.
              inputModes:
                - text/plain
              outputModes:
                - text/plain
              securityRequirements:
                - broker_api_key: []
