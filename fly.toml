# Fly.io config for the consolidated Agent Network Tracer (web + worker).
#
# One image, two process groups:
#   web    — Next.js server (UI + /api/lifecycle). Always-on; see auto_stop_machines below.
#   worker — lifecycle-worker.ts. Always-on so queued jobs are drained promptly.
#
# Change `app` and `primary_region` to your own before `fly deploy`.
# (`fly launch --no-deploy` will fill these in for you.)

app = "agent-network-tracer"
primary_region = "dub"   # Dublin — closest to Cloudhub EU-West-1. Adjust as needed.

# The worker needs longer than Fly's 5s default to stop its CLI children and
# record a terminal state for in-flight jobs before the machine is killed.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  WORKSPACE_ROOT = "/tmp/anf-jobs"
  # ANYPOINT_CLI_DEBUG = "1"   # uncomment to append --debug to every CLI run

[processes]
  web = "npm run start"
  worker = "npm run worker"

# Public HTTPS endpoint — only the web process serves traffic.
[http_service]
  internal_port = 3000
  force_https = true
  # Tried "stop" (proxy scaled the sole machine to zero after ~9min idle, next
  # visitor ate a ~6s Firecracker cold boot) and "suspend" (resumes from a
  # memory snapshot instead of a cold boot, but the resume itself was still a
  # noticeable stall on the first request after any idle period). "off" keeps
  # the web machine running at all times — no idle-cost savings, but no
  # wake-up latency either.
  auto_stop_machines = "off"
  auto_start_machines = true
  # Keep one web machine up. Scaling to zero stalls an active session: reading a
  # finished build log sends no requests, the proxy autostops the only machine,
  # and the next click lands while it is still stopping ("machine is in a
  # non-startable state"). The request fails and a client-side route change just
  # never completes.
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Web can be small and scale to zero.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web"]

# Worker runs the Anypoint CLI builds — give it headroom and keep 1 always on.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
